<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Khushi Dua Admin Panel">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Khushi Dua Admin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #F6F7FB;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      color: #1A237E;
      font-family: 'Segoe UI', Roboto, Tahoma, Geneva, Verdana, sans-serif;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(26, 35, 126, 0.1);
      border-left-color: #1A237E;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-size: 15px;
      font-weight: 600;
      opacity: 0.7;
    }

    /* Dark, as chosen in the panel (AppearanceController) or by the system. */
    html.dark body { background-color: #0E1120; }
    html.dark #loading-container { color: #C5CAE9; }
    html.dark .spinner {
      border-color: rgba(197, 202, 233, 0.12);
      border-left-color: #C5CAE9;
    }
  </style>
  <script>
    (function () {
      var mode = null;
      try { mode = localStorage.getItem('appearance'); } catch (e) {}
      var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia &&
        window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
</head>

<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">Loading Khushi Dua Admin…</div>
  </div>

  <script>
    // Repairs browsers that an older build of the panel left behind. Those
    // builds installed Flutter's caching service worker, which keeps serving
    // the old files (the old icon font, so icons drew blank) without asking
    // the server. Remove it and its caches, reload once if it was in control
    // of this page, then start the app.
    (async function () {
      var hadWorker = false;
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var i = 0; i < regs.length; i++) {
            var w = regs[i].active || regs[i].waiting || regs[i].installing;
            if (w && w.scriptURL.indexOf('flutter_service_worker') !== -1) {
              hadWorker = true;
              await regs[i].unregister();
            }
          }
        }
        if (window.caches) {
          var keys = await caches.keys();
          for (var j = 0; j < keys.length; j++) {
            if (keys[j].indexOf('flutter') === 0) await caches.delete(keys[j]);
          }
        }
      } catch (e) {
        console.warn('Could not clear old caches', e);
      }
      // This page was itself served by the old worker: load it afresh.
      if (hadWorker && navigator.serviceWorker && navigator.serviceWorker.controller &&
          !sessionStorage.getItem('swCleared')) {
        sessionStorage.setItem('swCleared', '1');
        location.reload();
        return;
      }
      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>

  <script>
    // Remove the loading indicator once the app is ready
    window.addEventListener('flutter-first-frame', function () {
      var loadingContainer = document.getElementById('loading-container');
      if (loadingContainer) {
        loadingContainer.style.opacity = '0';
        setTimeout(function () {
          loadingContainer.remove();
        }, 500);
      }
    });

    // Fallback if the event doesn't fire (older versions)
    setTimeout(function () {
      var loadingContainer = document.getElementById('loading-container');
      if (loadingContainer) {
        // If the engine has clearly started (canvas present)
        if (document.querySelector('flt-glass-pane')) {
          loadingContainer.style.opacity = '0';
          setTimeout(function () { loadingContainer.remove(); }, 500);
        }
      }
    }, 10000);
  </script>
</body>

</html>

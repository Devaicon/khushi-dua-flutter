<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Khushi Dua Admin Panel">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Khushi Dua Admin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #1E1E1E;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-left-color: #65D35A;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
      box-shadow: 0 0 15px rgba(101, 211, 90, 0.2);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-size: 16px;
      letter-spacing: 1px;
      font-weight: 300;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-text">INITIALIZING ADMIN PANEL...</div>
  </div>

  <!-- This file was generated by flutter build web and copied manually to ensure compatibility -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Remove the loading indicator once the app is ready
    window.addEventListener('flutter-first-frame', function () {
      var loadingContainer = document.getElementById('loading-container');
      if (loadingContainer) {
        loadingContainer.style.opacity = '0';
        setTimeout(function () {
          loadingContainer.remove();
        }, 500);
      }
    });

    // Fallback if the event doesn't fire (older versions)
    setTimeout(function () {
      var loadingContainer = document.getElementById('loading-container');
      if (loadingContainer) {
        // If the engine has clearly started (canvas present)
        if (document.querySelector('flt-glass-pane')) {
          loadingContainer.style.opacity = '0';
          setTimeout(function () { loadingContainer.remove(); }, 500);
        }
      }
    }, 10000);
  </script>
</body>

</html>

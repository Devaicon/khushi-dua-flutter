name: khushidua
description: "A new Flutter project."

publish_to: "none"

version: 1.6.0+32

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get:
  shared_preferences:
  flutter_svg:
  audioplayers:
  hijri:
  prayers_times:
  geolocator:
  geocoding:
  intl:
  flutter_compass:
  firebase_core:
  cloud_firestore:
  firebase_auth:
  firebase_storage:
  firebase_messaging:
  share_plus:
  package_info_plus:
  record: ^5.2.1
  # ffmpeg_kit_flutter_full:
  http:
  http_parser:
  path:
  flutter_html:
  # 13.x pulls permission_handler_android 14.x, which requires compileSdk 37; Google only
  # publishes android-37.0/37.1, whose hash AGP 8.x cannot resolve. 12.x targets 35.
  permission_handler: ^12.0.1
  path_provider:
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  background_downloader: ^9.6.3
  sensors_plus: ^7.1.1

dependency_overrides:
  record_linux: ^1.2.1
  # html 0.15.7 removed the top-level `matches`, which flutter_html 3.0.0 uses.
  html: 0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/legal/

  # Family names are referenced through lib/constants/fonts.dart (AppFonts).
  fonts:
    # Noor-e-Huda v1.002 (noorehidayat.org; its licence allows bundling it
    # with an app), for all Arabic text. Adjusted for the app: the hamza
    # its لأ glyph is missing is added back (الأذان rendered as الاذان), its
    # digits are ayah-marker glyphs so they are dropped, its very narrow word
    # space is widened, it is scaled up to Noto Naskh's size and its
    # oversized line box is tightened. Rebuild with tool/fonts/patch_huda.py
    # (usage in its docstring).
    - family: arabic
      fonts:
        - asset: assets/fonts/NoorHuda-Regular.ttf
    # Jameel Noori Nastaleeq, for all Urdu text.
    - family: urdu
      fonts:
        - asset: assets/fonts/JameelNooriNastaleeq-Regular.ttf
    # Noto Naskh Arabic (SIL OFL, see assets/fonts/OFL.txt): fallback for
    # the few characters the two fonts above lack (digits, alef wasla,
    # tatweel in Urdu), so they never come from the device font.
    - family: naskh
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700

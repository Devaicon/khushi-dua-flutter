name: khushidua
description: "A new Flutter project."

publish_to: "none"

version: 1.4.2+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get:
  shared_preferences:
  flutter_svg:
  audioplayers:
  hijri:
  prayers_times:
  geolocator:
  geocoding:
  intl:
  flutter_compass:
  firebase_core:
  cloud_firestore:
  firebase_auth:
  firebase_storage:
  firebase_messaging:
  share_plus:
  record: ^5.2.1
  # ffmpeg_kit_flutter_full:
  http:
  http_parser:
  path:
  flutter_html:
  # 13.x pulls permission_handler_android 14.x, which requires compileSdk 37; Google only
  # publishes android-37.0/37.1, whose hash AGP 8.x cannot resolve. 12.x targets 35.
  permission_handler: ^12.0.1
  path_provider:
  google_mobile_ads:
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1

dependency_overrides:
  record_linux: ^1.2.1
  # html 0.15.7 removed the top-level `matches`, which flutter_html 3.0.0 uses.
  html: 0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: arabic
      fonts:
        - asset: assets/fonts/noorehidaya2.ttf
